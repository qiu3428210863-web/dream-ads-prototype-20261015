<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pick your product</title><style>
*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#0b0b0d;color:#fafafa;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer}#root{position:relative;width:1920px;height:1080px;overflow:hidden;perspective:1900px}#page{position:absolute;inset:0;background:#101012;padding:46px 52px;transform-style:preserve-3d}.header{display:flex;align-items:center;justify-content:space-between;height:94px;margin-bottom:27px;border-bottom:1px solid #333039}.header h1{font-size:42px;font-weight:500;letter-spacing:-1.8px;margin:0}.header span{font-size:18px;color:#a6a0ab}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:27px}.product{position:relative;border:1px solid #3e3741;border-radius:26px;background:#1b171d;text-align:left;padding:14px;overflow:hidden}.product img{width:100%;height:590px;object-fit:cover;border-radius:17px}.product h2{font-size:29px;font-weight:500;margin:20px 12px 10px;letter-spacing:-.8px}.product p{font-size:18px;color:#aaa2ae;margin:0 12px 21px}.selected-label{position:absolute;right:30px;top:30px;padding:10px 17px;background:#e833bc;border-radius:22px;font-size:15px;font-weight:700;opacity:0}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding:21px 26px;border:1px solid #38313b;border-radius:18px;background:#171319;font-size:20px}.footer small{display:block;color:#9f97a5;font-size:14px;margin-top:7px}.footer button{border:0;background:#e833bc;padding:17px 28px;border-radius:12px;font-weight:bold;font-size:19px}.cursor{position:absolute;left:0;top:0;z-index:10;width:38px;height:49px;filter:drop-shadow(0 4px 5px #0009)}.ripple{position:absolute;z-index:9;left:0;top:0;width:54px;height:54px;margin:-27px;border:3px solid #e833bc;border-radius:50%;opacity:0}
</style></head><body><main id="root" data-composition-id="root" data-width="1920" data-height="1080" data-fps="30" data-duration="7"><div id="page"><header class="header"><h1>Choose your product.</h1><span>Your next campaign starts here.</span></header><div class="products"><button class="product"><img src="../assets/product-activewear.webp" alt=""><h2>Performance wear</h2><p>Movement, made electric.</p></button><button class="product" id="soda"><span class="selected-label">SELECTED</span><img src="../assets/product-orange-soda-still.jpg" alt=""><h2>Orange soda</h2><p>A sip of something bigger.</p></button><button class="product"><img src="../assets/product-oats.webp" alt=""><h2>Oat breakfast</h2><p>A little morning ritual.</p></button></div><footer class="footer"><div><span id="selection">Pick a product to get started</span><small>A real favourite. Or something entirely imagined.</small></div><button id="continue">Use this product</button></footer><div class="ripple"></div><svg class="cursor" viewBox="0 0 38 49"><path d="M2 2v36l9-9 7 16 7-3-7-16h14L2 2z" fill="#fff" stroke="#111" stroke-width="2"/></svg></div></main><script src="../node_modules/gsap/dist/gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});window.__timelines={root:tl};
const center=s=>{const r=document.querySelector(s).getBoundingClientRect();return{x:r.x+r.width/2,y:r.y+r.height/2}};const pick=center('#soda'),next=center('#continue');window.__clickTargets={pick,next};
function move(p,t,d=.65){tl.to('.cursor',{x:p.x-2,y:p.y-2,duration:d,ease:'power2.inOut'},t)}
function click(p,t){tl.set('.ripple',{x:p.x,y:p.y,scale:.2,opacity:1},t).to('.ripple',{scale:1.6,opacity:0,duration:.5,ease:'power2.out'},t)}
tl.set('.cursor',{x:1550,y:950}).set('#page',{scale:.96,rotationX:3,rotationY:-3}).to('#page',{scale:1,rotationX:0,rotationY:0,duration:.8,ease:'power2.out'},0);
move(pick,.6);tl.to('#page',{scale:1.4,y:40,rotationX:5,rotationY:-4,duration:.9,ease:'power2.inOut'},.9);click(pick,1.65);tl.to('#soda',{borderColor:'#e833bc',backgroundColor:'#261b26',duration:.2},1.65).to('.selected-label',{opacity:1,duration:.2},1.65).set('#selection',{textContent:'Orange soda'},1.65);
move(next,2.5,.8);tl.to('#page',{scale:1.27,x:-220,y:-100,rotationX:-3,rotationY:3,duration:.8,ease:'power2.inOut'},2.5);click(next,3.4);tl.to('#continue',{backgroundColor:'#a91886',duration:.16,yoyo:true,repeat:1},3.4).to('#page',{scale:1,x:0,y:0,rotationX:0,rotationY:0,duration:1.1,ease:'power2.inOut'},4).to('.cursor',{opacity:0,duration:.3},4.5).to({},{duration:1.6},5.4);
</script></body></html>
